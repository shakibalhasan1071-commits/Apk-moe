kind = "mobile"
previewPath = "/"
title = "Madrasa of Excellence"
description = "A bilingual mobile learning app for Madrasa of Excellence, helping students discover Islamic education courses, continue lessons, track progress, and manage their learning journey on Android and iPhone."
version = "1.0.0"
id = "artifacts/madrasa-excellence-app"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24364

[services.development]
run = "pnpm --filter @workspace/madrasa-excellence-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/madrasa-excellence-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/madrasa-excellence-app", "run", "serve" ]

[services.env]
PORT = "24364"
BASE_PATH = "/"
